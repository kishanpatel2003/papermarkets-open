[project]
name = "papermarkets"
version = "0.1.0"
description = "Historical simulation engine for prediction markets"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=23.0",
    "duckdb>=1.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"scripts/investigation/build_static.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
